<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0F3D3E">
    <meta name="description" content="Niri's Cove — sail a small boat through a calm Caribbean archipelago and discover Niri Levy's portfolio, island by island.">
    <title>Niri's Cove</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="loading-screen">
        <div class="loading-waves"></div>
        <div class="loading-content">
            <p class="loading-eyebrow">A portfolio you can sail</p>
            <h1 class="loading-title">Niri's Cove</h1>
            <p class="loading-subtitle">Charting the waters...</p>
            <div class="loading-bar-container">
                <div class="loading-bar-fill"></div>
            </div>
            <button class="loading-launch">Set Sail</button>
        </div>
    </div>
    <script type="module" src="/sources/main.js"></script>

</html>
